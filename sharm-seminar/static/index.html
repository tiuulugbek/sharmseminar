<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acoustic · Sharm seminar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="/vendor/jsQR.min.js"></script>
<style>
:root{
  --indigo:#2E2C6E; --indigo-2:#3F3C8F; --indigo-ink:#211F52;
  --orange:#F07E1A; --orange-2:#E06A0A; --orange-soft:#FDEBD8;
  --bg:#F4F5F9; --surface:#FFFFFF; --ink:#1B1A2E; --muted:#6C6B80;
  --line:#E6E7F1; --line-2:#D9DAE8;
  --rt-single:#FFF2B2; --rt-double:#D1E8FF; --rt-triple:#D1F2D1; --rt-posh:#E5D1F4;
  --g1:#5B7CFA; --g2:#F07E1A; --g3:#12B886; --g4:#E4508B; --g5:#8A63D2;
  --ok:#12B886; --shadow:0 1px 2px rgba(33,31,82,.06),0 8px 24px rgba(33,31,82,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--indigo);color:#EDECF7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.10)}
.brand img{height:26px;background:#fff;border-radius:6px;padding:5px 7px}
.brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B7B5E0;margin-top:3px}
.brand b{font-size:13px;font-weight:700;letter-spacing:.02em}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#C9C7EC;font-size:13.5px;font-weight:500;text-align:left;transition:.13s}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--indigo);font-weight:600}
.side .foot{padding:14px;font-size:11px;color:#8886BE;border-top:1px solid rgba(255,255,255,.10)}
.side .foot .mode{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-weight:600}
.wave path{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round}

.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(244,245,249,.82);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--indigo-ink)}
.top .desc{font-size:12.5px;color:var(--muted);margin-top:1px}
.top .sp{flex:1}
.lang{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.lang button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--indigo);color:#fff}
.view{padding:24px 26px 60px;max-width:1220px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:.13s}
.btn:hover{border-color:var(--indigo);color:var(--indigo)}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.pri:hover{background:var(--indigo-ink)}
.btn.acc{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.acc:hover{background:var(--orange-2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-2)}
.muted{color:var(--muted)}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{padding:18px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--indigo-ink);margin-top:6px;line-height:1}
.stat .n{font-size:12px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.panel{padding:18px 20px}
.panel h3{font-size:14px;font-weight:700;color:var(--indigo-ink)}
.panel .ph{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin:11px 0}
.bar-row .lbl{width:120px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.bar{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-row .val{width:66px;text-align:right;font-size:12.5px;font-weight:700;color:var(--indigo-ink)}
.cp-row .lbl{width:132px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.search .mag{position:absolute;left:11px;top:9px;color:var(--muted)}
select.f{padding:8px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:500}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAFE}
.id{font-size:11.5px;font-weight:700;color:var(--indigo);letter-spacing:.02em}
.rg{font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:6px}
.gsel{padding:5px 8px;border:1px solid var(--line-2);border-radius:7px;font-weight:600;font-size:12.5px;background:var(--surface)}
.star{font-size:16px;line-height:1;padding:3px 6px;border-radius:6px}
.star.on{color:var(--orange)}.star.off{color:var(--line-2)}
.leadtag{font-size:10px;font-weight:800;color:#fff;background:var(--orange);padding:1px 6px;border-radius:5px;letter-spacing:.04em}
.cellinput{width:100%;max-width:130px;padding:5px 8px;border:1px solid var(--line-2);border-radius:7px}

.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.grp{padding:0;overflow:hidden}
.grp .hd{padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.grp .hd .t{font-size:15px;font-weight:700}
.grp .hd .c{font-size:12px;font-weight:600;opacity:.9}
.grp .bd{max-height:340px;overflow-y:auto}
.grp .mrow{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.grp .mrow:last-child{border-bottom:none}
.grp .mrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .mrow .setlead{font-size:15px;color:var(--line-2)}
.grp .mrow .setlead.on{color:var(--orange)}
.grp .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- badge designer ---------- */
.des{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.des-stage-wrap{background:linear-gradient(135deg,#EDEEF6,#F7F8FC);border:1px solid var(--line);border-radius:16px;
  padding:26px;display:flex;justify-content:center;box-shadow:var(--shadow);overflow:auto}
.stage{transform-origin:top center}
.badge-box{position:relative;overflow:hidden;border-radius:3mm;box-shadow:0 6px 26px rgba(33,31,82,.22)}
.badge-box.editing .be{cursor:grab}
.badge-box.editing .be:hover{outline:1.5px solid rgba(46,44,110,.35)}
.badge-box.editing .be.sel{outline:2px dashed var(--orange);outline-offset:1px}
.be{position:absolute}
.betext{overflow:hidden;white-space:pre-wrap;word-break:break-word}
.badge-box.editing .betext[contenteditable=true]{cursor:text;outline:2px solid #5B7CFA!important;background:rgba(255,255,255,.92);padding:1mm;z-index:20}
.beqr canvas{display:block}
.punch{position:absolute;top:2.5mm;left:50%;transform:translateX(-50%);width:14mm;height:3mm;border-radius:2mm;
  background:rgba(0,0,0,.12);border:.4mm solid rgba(0,0,0,.18)}

.props{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
.pblock{padding:14px 16px}
.pblock h4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-2);margin-bottom:12px}
.addrow{display:flex;flex-wrap:wrap;gap:7px}
.addrow .btn{padding:7px 10px;font-size:12px}
.frow{display:flex;align-items:center;gap:10px;margin:9px 0}
.frow label{width:70px;font-size:12px;font-weight:600;color:var(--muted)}
.frow input[type=number],.frow input[type=text],.frow select,.frow textarea{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line-2);border-radius:8px;background:#fff}
.frow textarea{min-height:72px;resize:vertical;font:inherit;line-height:1.35}
.hint{font-size:11px;color:var(--muted);line-height:1.4;margin-top:7px}
.frow input[type=color]{width:38px;height:30px;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:#fff}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:1}
.seg button{flex:1;padding:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--indigo);color:#fff}
.nofocus{color:var(--muted);font-size:12.5px;text-align:center;padding:12px 0}
.logo-up{display:flex;align-items:center;gap:10px}
.logo-up .prev{width:44px;height:44px;border:1px solid var(--line-2);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.logo-up .prev img{max-width:100%;max-height:100%}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--indigo-ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.burger{display:none;font-size:20px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line-2)}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,19,50,.4);z-index:55}
.scrim.show{display:block}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;z-index:60;width:236px;transition:.2s}
  .side.open{left:0}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .des{grid-template-columns:1fr}
  .props{position:static}
  .burger{display:inline-flex!important}
}

/* ---------- print ---------- */
#printwrap{display:none}
@media print{
  .app,.scrim,.toast{display:none!important}
  #printwrap{display:flex!important;flex-wrap:wrap;gap:0}
  .pbadge{position:relative;overflow:hidden;page-break-after:always;outline:.2mm solid #ccc}
  @page{margin:8mm;size:auto}
}

/* ===== kirish (maxfiy kod) ===== */
.gate{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;
  padding:22px;background:radial-gradient(120% 90% at 80% -10%,#5B4BC4 0%,#2E2C6E 42%,#1A1848 100%)}
.gate.show{display:flex}
.gate .box{width:100%;max-width:360px;background:#fff;border-radius:18px;padding:28px 24px;
  box-shadow:0 26px 60px rgba(0,0,0,.35);text-align:center}
.gate .box h2{font-size:19px;font-weight:800;color:#211F52;margin-bottom:6px}
.gate .box p{font-size:13px;color:#7A7990;margin-bottom:18px}
.gate input{width:100%;padding:14px;border:1px solid #E7E8F0;border-radius:12px;font-size:17px;
  font-weight:700;text-align:center;letter-spacing:.08em}
.gate input:focus{outline:none;border-color:#2E2C6E}
.gate button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#2E2C6E;
  color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:default}
.gate .err{margin-top:12px;font-size:13px;font-weight:700;color:#E03131;min-height:18px}
.whoami{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#7A7990}
.whoami b{color:#211F52;font-weight:700}
.whoami .out{border:1px solid #E7E8F0;background:#fff;border-radius:8px;padding:6px 10px;
  font-weight:700;cursor:pointer;color:#7A7990}
.holdon{background:#FFF4E5;border-color:#F0C68A}
.dropzone{border:2px dashed var(--line-2);border-radius:16px;padding:26px 18px;text-align:center;
  cursor:pointer;background:#fff;margin-bottom:14px;transition:.15s}
.dropzone:hover,.dropzone.over{border-color:var(--indigo);background:#F7F8FE}
.dropzone .dzi{font-size:28px;margin-bottom:6px}
.dzmsg{margin-top:10px;font-size:12.5px;font-weight:600;text-align:left;
  background:#F4F5FA;border-radius:9px;padding:8px 11px}
.dzmsg.ok{background:#EAFBF3;color:#0B7A5A}
.dzmsg.bad{background:#FFF4E5;color:#9A5B00}
.docchip{display:inline-flex;align-items:center;gap:6px;background:#EEF0FA;border-radius:8px;
  padding:3px 8px;font-size:11.5px;font-weight:600;max-width:100%}
.docchip a{color:var(--indigo);text-decoration:none;max-width:210px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.docchip a:hover{text-decoration:underline}
.docchip i{font-style:normal;color:var(--muted);font-size:10.5px}
.docchip u{text-decoration:none;color:#12B886}
.docchip.warn{background:#FFF4E5;outline:1px solid #F0C68A}
.kindsel{border:0;background:transparent;font-size:12px;cursor:pointer;padding:0;width:22px}
.docchip b{cursor:pointer;color:#C0392B;opacity:.6}
.docchip b:hover{opacity:1}
.lab2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:800;margin-bottom:7px}
.draftbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:800;
  display:flex;align-items:center;gap:10px;background:#211F52;color:#fff;border-radius:999px;
  padding:9px 12px 9px 18px;box-shadow:0 12px 34px rgba(20,18,60,.34);animation:draftin .22s ease}
@keyframes draftin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.draftbar .cnt{font-size:13px;font-weight:700;white-space:nowrap}
.draftbar .btn{padding:7px 13px;font-size:13px}
@media(max-width:520px){.holdon{background:#FFF4E5;border-color:#F0C68A}

  padding:3px 8px;font-size:11.5px;font-weight:600;max-width:100%}
.docchip a{color:var(--indigo);text-decoration:none;max-width:210px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.docchip i{font-style:normal;color:var(--muted);font-size:10.5px}
.docchip u{text-decoration:none;color:#12B886}
.docchip.warn{background:#FFF4E5;outline:1px solid #F0C68A}
.kindsel{border:0;background:transparent;font-size:12px;cursor:pointer;padding:0;width:22px}
.docchip b{cursor:pointer;color:#C0392B;opacity:.6}
.docchip b:hover{opacity:1}
.lab2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:800;margin-bottom:7px}
.draftbar{left:12px;right:12px;transform:none;justify-content:space-between;
  border-radius:14px;padding:10px 12px}
  @keyframes draftin{from{opacity:0}to{opacity:1}}}
.movers{display:flex;gap:1px;align-items:center}
.movers b{cursor:pointer;font-size:13px;line-height:1;padding:5px 6px;border-radius:6px;
  color:var(--muted);opacity:.7}
.movers b:hover{opacity:1;background:#EEF0FA;color:var(--indigo)}
.movers b.off{opacity:.18;pointer-events:none}
.movers b.del{color:#C0392B}
.mlbox{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.mlbox>span+input{margin-bottom:2px}
.mltag{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.mlbox input{width:100%}
.langnote{display:inline-flex;align-items:center;gap:5px;background:#EEF0FA;color:#2E2C6E;
  border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
/* ===== kamera skaneri ===== */
.camwrap video{width:100%;max-width:340px;border-radius:12px;background:#000;display:block;
  aspect-ratio:1/1;object-fit:cover;margin:0 auto}
.roomsel{max-width:190px}
.swapx{cursor:pointer;color:var(--muted);font-size:12px;opacity:.5;margin-left:3px}
.swapx:hover{opacity:1;color:var(--indigo)}
.modal{position:fixed;inset:0;z-index:900;background:rgba(20,18,60,.45);display:flex;
  align-items:center;justify-content:center;padding:20px}
.modal .mbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:430px;
  max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(20,18,60,.3)}
.modal h3{font-size:17px;font-weight:800;color:var(--indigo);margin-bottom:4px}
.modal .frow{margin-bottom:9px}
.modal input,.modal select{flex:1;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;font:inherit}
.modal label{min-width:118px;font-size:12.5px}
.warnbox{background:#FFF4E5;color:#9A5B00;border-radius:10px;padding:10px 12px;
  font-size:12px;font-weight:600;margin:12px 0}
.mrow2{display:flex;gap:8px;justify-content:flex-end}
.sortth{cursor:pointer;user-select:none;white-space:nowrap}
.sortth:hover{color:var(--indigo)}
.sortth i{font-style:normal;font-size:9px;opacity:.35;margin-left:4px}
.sortth.on i{opacity:1;color:var(--indigo)}
.btn.xls{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12.5px;
  padding:8px 12px;color:var(--muted)}
.btn.xls:hover{color:var(--indigo);border-color:var(--indigo)}
.tgchip{display:inline-block;max-width:110px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:middle;font-size:11.5px;font-weight:600;color:#2E2C6E;
  background:#EEF0FA;border-radius:6px;padding:2px 7px}
.tgx{cursor:pointer;color:#C0392B;opacity:.55;margin-left:5px;font-size:12px}
.tgx:hover{opacity:1}
.cpnum{position:absolute;top:5px;left:8px;font-size:10px;font-weight:900;opacity:.5}
.cpord{position:absolute;top:3px;right:5px;display:flex;gap:2px}
.cpord b{cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:5px;opacity:.55}
.cpord b:hover{opacity:1;background:rgba(0,0,0,.07)}
.cpord b.off{opacity:.18;pointer-events:none}
.cpord b.del{color:#C0392B}
.cambig{border-radius:14px;padding:15px 14px;margin-top:10px;text-align:center;color:#fff;
  animation:campop .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes campop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}

const tx=v=>(v&&typeof v==='object')?(v[S.lang]||v.uz||v.ru||v.en||''):(v||'');
function mx(old,val,lang){
  const base=(old&&typeof old==='object')?{...old}:{uz:old||'',ru:old||'',en:old||''};
  base[lang||S.lang]=val;
  return base;
}
const cpName=k=>{const c=(S.checkpoints||[]).find(x=>x.key===k);return c?tx(c.label):k;};
const cpIcon=k=>{const c=(S.checkpoints||[]).find(x=>x.key===k);return c?c.icon:'•';};

const api={
 mode:'server',
 // Panel endi doim serverdan o'qiydi: ma'lumot maxfiy kod bilan himoyalangan,
 // shuning uchun brauzer xotirasidagi zaxira nusxa saqlanmaydi.
 async boot(){
   try{const r=await fetch('/api/bootstrap',{cache:'no-store'});
     if(r.status===401)return {unauthorized:true};
     if(r.ok)return await r.json();}catch(e){}
   return null;
 },
 saveLocal(){ /* server-only: brauzerda nusxa qoldirmaymiz */ },
 async _post(url,body){
   try{const r=await fetch(url,{method:'POST',headers:H,body:JSON.stringify(body)});
     if(r.status===401){showGate();return false;}
     if(r.status===403){toast(t('noRight'));return false;}
     return r.ok;}catch(e){return false;} },
 async patch(id,patch){ return this._post('/api/participant',{id,patch}); },
 async bulk(items){ return this._post('/api/participants/bulk',{items}); },
 async checkin(id,cp,on){
   try{const r=await fetch('/api/checkin',{method:'POST',headers:H,body:JSON.stringify({id,checkpoint:cp,on})});
     if(r.status===401){showGate();return null;}
     if(r.status===403){toast(t('noRight'));return null;}
     return await r.json();}catch(e){return {status:on?'ok':'removed',ts:on?nowHM():null};} },
 async saveCheckpoints(){ return this._post('/api/checkpoints',{checkpoints:S.checkpoints}); },
 async saveProgram(){ return this._post('/api/program',S.program); },
 async saveRoles(){ return this._post('/api/roles',S.roles); },
 async saveMeta(){ return this._post('/api/meta',S.meta); },
 async savePageBase(){ return this._post('/api/pagebase',{base:S.pageBase}); },
 async saveLogo(u){ return this._post('/api/seminar-logo',{dataUrl:u}); }
};
const nowHM=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());};

/* ===== helpers ===== */
const P=()=>S.participants;

function groupCounts(){const c=[0,0,0,0,0,0];P().forEach(p=>{if(p.group)c[p.group]++;});return c;}
function cpCount(k){return Object.keys(S.checkins[k]||{}).length;}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600);}

// Har bir bo'lim uchun eng past rol. member — faqat o'zi haqidagi ma'lumot,
// leader — o'z guruhi, manager — barcha guruhlar, admin — sozlamalar ham.
const NAV=[['dash','▦','member'],['parts','☰','member'],['groups','◍','leader'],
           ['roles','◆','manager'],['program','▤','member'],['qr','▩','leader'],
           ['docs','📎','member'],['checkin','✓','leader']];
const RANK={member:0,leader:1,manager:2,admin:3};
const myRank=()=>RANK[(S.user&&S.user.role)||'member']||0;
const can=need=>myRank()>=RANK[need];
const visibleNav=()=>NAV.filter(([,,need])=>can(need));
function renderNav(){document.getElementById('nav').innerHTML=visibleNav().map(([id,ic])=>
  `<button class="${VIEW===id?'on':''}" onclick="go('${id}')"><span class="ic">${ic}</span>${t(id)}</button>`).join('');}
function go(v){if(camOn)stopCam();VIEW=v;selEid=null;toggleNav(false);render();}
function toggleNav(open){document.getElementById('side').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('show',open);}
const UI_LANGS=['uz','ru','en'];
function renderLangBar(){document.getElementById('langbar').innerHTML=UI_LANGS.map(l=>
  `<button class="${S.lang===l?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('');}
function setLang(l){if(!UI_LANGS.includes(l))return;S.lang=l;
  try{localStorage.setItem('sharm_ui_lang',l);}catch(e){}
  renderLangBar();render();}

function render(){
  if(!visibleNav().some(([id])=>id===VIEW))VIEW=(visibleNav()[0]||['dash'])[0];
  renderNav();
  renderWhoami();
  document.getElementById('vtitle').textContent=t(VIEW);
  document.getElementById('vdesc').textContent=t('vdesc_'+VIEW);
  const v=document.getElementById('view');
  if(VIEW==='dash')v.innerHTML=renderDash();
  else if(VIEW==='parts')renderParts(v);
  else if(VIEW==='groups')v.innerHTML=renderGroups();
  else if(VIEW==='roles')renderRoles(v);
  else if(VIEW==='program')renderProgram(v);
  else if(VIEW==='qr')renderQR(v);
  else if(VIEW==='docs')renderDocs(v);
  else if(VIEW==='checkin')renderCheckin(v);
}

function renderDash(){
  const gc=groupCounts(),total=P().length,
    assigned=P().filter(p=>p.group).length,leaders=P().filter(p=>p.leader).length,
    foreign=P().filter(p=>p.kelish==='Chet eldan alohida').length,maxg=Math.max(1,...gc.slice(1));
  const gbars=[1,2,3,4,5].map(g=>`<div class="bar-row"><div class="lbl"><span class="dot" style="background:${GCOL[g]}"></span>${t('grp')} ${g}</div>
    <div class="bar"><span style="width:${gc[g]/maxg*100}%;background:${GCOL[g]}"></span></div><div class="val tnum">${gc[g]} ${t('member')}</div></div>`).join('');
  const cpbars=CPS().map(c=>{const n=cpCount(c.key);return`<div class="bar-row cp-row"><div class="lbl">${c.icon||'•'} ${escapeHtml(tx(c.label))}</div>
    <div class="bar"><span style="width:${total?n/total*100:0}%;background:var(--ok)"></span></div><div class="val tnum">${n}/${total}</div></div>`;}).join('')||`<div class="muted" style="font-size:12.5px">Nuqta yo'q</div>`;
  return `<div class="stat-grid">
    <div class="card stat"><div class="k">${t('total')}</div><div class="v tnum">${total}</div><div class="n">7 single · 76 double · 18 triple · 3 posh</div></div>

    <div class="card stat"><div class="k">${t('foreign')}</div><div class="v tnum">${foreign}</div><div class="n">Shvetsiya · Qozog'iston</div></div></div>
  <div class="grid2">
    <div class="card panel"><div class="ph"><span class="eyebrow">05</span><h3>${t('byGroup')}</h3></div>${gbars}</div>
    <div class="card panel"><div class="ph"><span class="eyebrow">04</span><h3>${t('cpProgress')}</h3></div>${cpbars}</div></div>`;
}

// Ustun sarlavhasi bosilsa shu ustun bo'yicha saralanadi; ikkinchi bosishda
// teskarisiga. Yosh yoki guruh yo'q bo'lsa doim oxirida turadi.
let sortKey='id', sortDir=1;
function sortTh(key,label,style){
  const on=sortKey===key;
  return `<th class="sortth${on?' on':''}" ${style?`style="${style}"`:''} onclick="setSort('${key}')">`
    + `${label}<i>${on?(sortDir>0?'▲':'▼'):'⇅'}</i></th>`;
}
function setSort(key){
  if(sortKey===key)sortDir=-sortDir; else {sortKey=key;sortDir=1;}
  renderParts(VW());
}
function sortRows(list){
  const val=p=>{
    const v=p[sortKey];
    if(sortKey==='age'||sortKey==='group')return v==null||v===''?null:+v;
    return (v==null?'':String(v)).toLowerCase();
  };
  return list.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x===null&&y===null)return 0;
    if(x===null)return 1;              // bo'sh qiymat doim oxirida
    if(y===null)return -1;
    return (x>y?1:x<y?-1:0)*sortDir;
  });
}

function filtered(){const q=fSearch.trim().toLowerCase();
  return sortRows(P().filter(p=>{
    if(q&&!(p.fio.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)))return false;
    if(fGroup==='0'&&p.group)return false;
    if(fGroup&&fGroup!=='0'&&String(p.group)!==fGroup)return false;
    if(fRoom&&p.xona_turi!==fRoom)return false;return true;}));}

/* ===== guruh taqsimoti: qoralama va saqlash ===== */
// Guruhni sozlash bir necha harakatdan iborat, har biri darrov saqlansa
// yarim tayyor holat bazaga tushib qoladi va odamlarga ortiqcha xabar boradi.
// Shuning uchun o'zgarishlar yig'iladi va "Saqlash" bosilganda birdan yoziladi.
const draftNew=new Map();   // id -> {group, leader}  (yangi qiymat)
const draftOld=new Map();   // id -> {group, leader}  (bekor qilish uchun)

function draftRemember(p){
  if(!draftOld.has(p.id))draftOld.set(p.id,{group:p.group,leader:p.leader});
}
function draftMark(p){
  draftRemember(p);
  const was=draftOld.get(p.id);
  if(was.group===p.group&&!!was.leader===!!p.leader){draftNew.delete(p.id);draftOld.delete(p.id);}
  else draftNew.set(p.id,{group:p.group,leader:p.leader});
}
const draftDirty=()=>draftNew.size;

function setGroup(id,g){
  const p=find(id); draftRemember(p);
  p.group=g?+g:null; if(!p.group)p.leader=false;
  draftMark(p); afterDraft();
}
function toggleLeader(id){
  const p=find(id); if(!p.group)return;
  if(!p.leader)P().forEach(x=>{ if(x.group===p.group&&x.leader){draftRemember(x);x.leader=false;draftMark(x);} });
  draftRemember(p); p.leader=!p.leader; draftMark(p);
  afterDraft();
}

function afterDraft(){
  renderDraftBar();
  if(VIEW==='parts')fillRows(); else if(VIEW==='groups')render();
}

// Guruh o'zgarishlarini saqlash: bo'lim panelida ham, pastdagi tasmada ham.
// Bir joyda ko'rinmay qolsa ikkinchisi qoladi.
function draftTools(){
  if(!draftDirty())return `<span class="langnote">✓ ${t('draftClean')}</span>`;
  return `<button class="btn pri" onclick="draftSave()">💾 ${t('draftSave')} (${draftDirty()})</button>
    <button class="btn" onclick="draftCancel()">${t('draftCancel')}</button>`;
}

function renderDraftBar(){
  let bar=document.getElementById('draftbar');
  if(!draftDirty()){ if(bar)bar.remove(); return; }
  if(!bar){
    bar=document.createElement('div'); bar.id='draftbar'; bar.className='draftbar';
    document.body.appendChild(bar);
  }
  bar.innerHTML=`<span class="cnt">${t('draftPending').replace('%n',draftDirty())}</span>
    <button class="btn" onclick="draftCancel()">${t('draftCancel')}</button>
    <button class="btn pri" onclick="draftSave()">💾 ${t('draftSave')}</button>`;
}

async function draftSave(){
  const items=[...draftNew.entries()].map(([id,v])=>({id,group:v.group,leader:v.leader}));
  if(!items.length)return;
  const ok=await api.bulk(items);
  if(ok===false)return;                       // 401/403 — api qatlami aytdi
  draftNew.clear(); draftOld.clear();
  renderDraftBar(); render();
  toast(t('draftSaved').replace('%n',items.length));
}

function draftCancel(){
  draftOld.forEach((was,id)=>{const p=find(id); if(p){p.group=was.group;p.leader=was.leader;}});
  draftNew.clear(); draftOld.clear();
  renderDraftBar(); render();
}

// Saqlanmagan o'zgarish bilan sahifani yopib yubormaslik uchun.
window.addEventListener('beforeunload',e=>{ if(draftDirty()){e.preventDefault();e.returnValue='';} });

  }).join('');
  const tools=can('admin')

       <button class="btn" style="color:#C0392B;border-color:#F3C6C0" onclick="clearGroups()">${t('clearAll')}</button>`

// Butun taqsimotni almashtiradi — shuning uchun aniq tasdiq so'raladi.
function autoDist(){
  if(!confirm(t('autoDistQ').replace('%n',P().length)))return;
  P().forEach(draftRemember);
  const byRoom={};P().forEach(p=>{(byRoom[p.xona_guruhi]=byRoom[p.xona_guruhi]||[]).push(p);});
  const rooms=Object.values(byRoom).sort((a,b)=>b.length-a.length);const counts=[0,0,0,0,0];
  rooms.forEach(room=>{let mi=0;for(let i=1;i<5;i++)if(counts[i]<counts[mi])mi=i;
    room.forEach(p=>{p.group=mi+1;});counts[mi]+=room.length;});
  // Mas'ul o'z guruhida qolsin; boshqa guruhga tushib qolgani mas'ullikdan chiqadi.
  const kept=new Set();
  P().forEach(p=>{ if(!p.leader)return;
    if(kept.has(p.group))p.leader=false; else kept.add(p.group); });
  P().forEach(draftMark);
  afterDraft(); toast(t('distDone'));
}
function clearGroups(){
  if(!confirm(t('clearAllQ')))return;
  P().forEach(p=>{draftRemember(p);p.group=null;p.leader=false;draftMark(p);});
  afterDraft(); toast(t('cleared'));}

function swap(list,i,j){
  if(i<0||j<0||i>=list.length||j>=list.length)return false;
  [list[i],list[j]]=[list[j],list[i]];return true;
}
function moveDay(di,d){ if(swap(S.program,di,di+d)){api.saveProgram();renderProgram(VW());} }
function moveBlock(di,bi,d){ if(swap(S.program[di].blocks,bi,bi+d)){api.saveProgram();renderProgram(VW());} }
function moveItem(di,bi,ii,d){ if(swap(S.program[di].blocks[bi].items,ii,ii+d)){api.saveProgram();renderProgram(VW());} }
function delItem(di,bi,ii){S.program[di].blocks[bi].items.splice(ii,1);api.saveProgram();renderProgram(VW());}

// A scanner may type "ACO-042", bare digits, a QR token or the whole
// https://.../p/<token> URL — all four resolve to the same participant.
function lookupScan(value){
  const raw=String(value||'').trim();if(!raw)return null;
  const tail=raw.replace(/[?#].*$/,'').replace(/\/+$/,'').split('/').pop();
  const up=tail.toUpperCase(), digits=up.replace(/[^0-9]/g,'');
  return P().find(x=>x.id.toUpperCase()===up)
      || P().find(x=>(x.token||'').toLowerCase()===tail.toLowerCase())
      || (digits?P().find(x=>x.id.replace(/[^0-9]/g,'')===digits):null)
      || null;
}
function setCP(k){if(camOn)stopCam();activeCP=k;renderCheckin(document.getElementById('view'));}
const activeCPObj=()=>CPS().find(c=>c.key===activeCP)||{};
// Nuqtalar tartibi muhim: skanerda oldingi nuqtalar o'tkazib yuborilgani
// shu tartib bo'yicha ogohlantirish sifatida chiqadi.
function moveCP(key,delta){
  const list=CPS(), i=list.findIndex(c=>c.key===key), j=i+delta;
  if(i<0||j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  api.saveCheckpoints();renderCheckin(document.getElementById('view'));
}
function cpWhen(c){
  const f=s=>s?String(s).replace('T',' ').slice(5,16):'';
  const a=f(c.starts_at), b=f(c.ends_at);
  return a&&b ? a+' → '+b : a ? a+' →' : b ? '→ '+b : '';
}
// Nuqta vaqt oynasi: bo'sh qoldirilsa nuqta har doim ochiq.
// Check-in vaqtlari shu mintaqada yoziladi va tekshiriladi. Toshkentda
// tarqatma berilsa UTC+5, Misrda seminar bo'lsa UTC+3.
function eventNow(){
  const off=+(S.tz??3);
  const d=new Date(Date.now()+off*3600000);
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}

/* ===== xona bloklari ===== */
// Xonadosh degani — bir xil `xona_guruhi` dagi odamlar. Blokni almashtirish
// xonadoshni almashtirish bilan bir xil.
function roomBlocks(){
  const map=new Map();
  P().forEach(p=>{ if(!p.xona_guruhi)return;
    if(!map.has(p.xona_guruhi))map.set(p.xona_guruhi,[]);
    map.get(p.xona_guruhi).push(p); });
  return map;
}
const roomCap=v=>{const s=String(v||'').toLowerCase();
  return s.includes('3')?3:s.includes('2')?2:s.includes('posh')?3:1;};

function roomCell(p){
  const blocks=roomBlocks(), keys=[...blocks.keys()].sort();
  const opts=keys.map(k=>{
    const mates=blocks.get(k).filter(x=>x.id!==p.id);
    const cap=roomCap(blocks.get(k)[0].xona_turi);
    const full=blocks.get(k).length>=cap&&k!==p.xona_guruhi;
    const who=mates.map(x=>x.fio.split(' ')[0]).join(', ');
    return `<option value="${k}" ${p.xona_guruhi===k?'selected':''}>${k} (${blocks.get(k).length}/${cap})${who?' · '+escapeHtml(who):''}${full?' ⚠':''}</option>`;
  }).join('');
  const mates=(blocks.get(p.xona_guruhi)||[]).filter(x=>x.id!==p.id).map(x=>x.fio).join(', ');
  return `<select class="gsel roomsel" title="${escapeHtml(mates||t('roomAlone'))}" onchange="setRoomBlock('${p.id}',this.value)">
      <option value="" ${!p.xona_guruhi?'selected':''}>${t('roomAlone')}</option>
      ${opts}<option value="__new">${t('roomNew')}</option></select>
    ${mates?`<div class="muted" style="font-size:10.5px;margin-top:2px">${escapeHtml(mates)}</div>`:''}`;
}

async function setRoomBlock(id,val){
  const p=find(id); if(!p)return;
  if(val==='__new'){
    val=(prompt(t('roomNewQ'),'')||'').trim().toUpperCase();
    if(!val){fillRows();return;}
  }
  const blocks=roomBlocks(), target=blocks.get(val)||[];
  if(val&&target.length){
    const cap=roomCap(target[0].xona_turi);
    if(target.length>=cap&&!target.some(x=>x.id===id)&&
       !confirm(t('roomFullQ').replace('%s',val).replace('%n',cap)))return fillRows();
  }
  const ok=await api.patch(id,{xona_guruhi:val});
  if(ok===false)return fillRows();
  p.xona_guruhi=val;
  fillRows();toast(t('saved'));
}

  let r;

// Panelda ham, botning mini-appida ham bitta narsa kerak: QR ni ko'rish va
// darrov belgilash. Bu yerda skaner check-in bo'limining ichida ochiladi.
let camStream=null, camOn=false, camLast='', camLastAt=0;

async function toggleCam(){ camOn ? stopCam() : startCam(); }

async function startCam(){
  const wrap=document.getElementById('camwrap'), btn=document.getElementById('camBtn');
  wrap.style.display='block';
  try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ document.getElementById('camhint').textContent=t('camErr')+': '+e.message; return; }
  const v=document.getElementById('camvid');
  v.srcObject=camStream; await v.play();
  camOn=true; btn.textContent=t('camStop');
  const cv=document.createElement('canvas'), ctx=cv.getContext('2d',{willReadFrequently:true});
  (function tick(){
    if(!camOn)return;
    if(v.readyState===v.HAVE_ENOUGH_DATA){
      cv.width=v.videoWidth; cv.height=v.videoHeight;
      ctx.drawImage(v,0,0,cv.width,cv.height);
      const img=ctx.getImageData(0,0,cv.width,cv.height);
      const code=window.jsQR&&jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(code&&code.data)camHit(code.data);
    }
    requestAnimationFrame(tick);
  })();
}

function stopCam(){
  camOn=false;
  if(camStream)camStream.getTracks().forEach(s=>s.stop());
  camStream=null;
  document.getElementById('camwrap').style.display='none';
  const btn=document.getElementById('camBtn'); if(btn)btn.textContent=t('camScan');
}

async function camHit(raw){
  const now=Date.now();
  if(raw===camLast&&now-camLastAt<2500)return;   // bitta QR — bitta urinish
  camLast=raw; camLastAt=now;
  const p=lookupScan(raw);
  if(!p)return camBanner('err',t('notFound'),String(raw).slice(-24));
  const res=await api.checkin(p.id,activeCP,true);
  if(!res)return;                                 // 401/403 — api qatlami aytdi
  const st=res.status||'ok';
  const warn=(res.warnings||[]).map(w=>tx(w.label)).filter(Boolean);
  const where=[p.group?t('grp')+' '+p.group:'',p.room?t('roomNo')+' '+p.room:''].filter(Boolean).join(' · ');
  if(st==='ok'){
    const map=S.checkins[activeCP]=S.checkins[activeCP]||{};
    map[p.id]=res.ts||nowHM(); fillCI();
    camBanner('ok',p.fio,[cpName(activeCP),where,res.ts].filter(Boolean).join(' · '),warn);
  }else if(st==='already'){
    camBanner('dup',p.fio,`${res.ts||''} ${t('camAlready')}`);
  }else if(st==='not_open'){
    camBanner('wait',p.fio,`${res.detail||''} ${t('camNotOpen')}`);
  }else if(st==='closed'){
    camBanner('wait',p.fio,`${res.detail||''} ${t('camClosed')}`);
  }else{
    camBanner('err',p.fio,st);
  }
}

const CAM_TITLE={ok:'camOk',dup:'camAlready2',wait:'camWait',err:'camErr2'};
function camBanner(kind,name,sub,warnings){
  const box=document.getElementById('camlog'); if(!box)return;
  const el=document.createElement('div');
  el.className='cambig '+kind;
  el.innerHTML='<div class="st"></div><div class="nm"></div><div class="sb"></div>';
  el.querySelector('.st').textContent=t(CAM_TITLE[kind]||'camErr2');
  el.querySelector('.nm').textContent=name||'';
  el.querySelector('.sb').textContent=sub||'';
  if(warnings&&warnings.length){
    const w=document.createElement('div'); w.className='wr';
    w.textContent='⚠️ '+t('camMissed')+': '+warnings.join(', ');
    el.appendChild(w);
  }
  box.prepend(el);
  while(box.children.length>4)box.lastChild.remove();
  camBeep(kind==='ok');
}

let camAudio=null;
function camBeep(good){
  try{
    camAudio=camAudio||new (window.AudioContext||window.webkitAudioContext)();
    (good?[880,1320]:[440]).forEach((f,i)=>{
      const o=camAudio.createOscillator(),g=camAudio.createGain();
      o.frequency.value=f;o.type='sine';
      const at=camAudio.currentTime+i*0.11;
      g.gain.setValueAtTime(0.001,camAudio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.22,at+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,at+0.1);
      o.connect(g);g.connect(camAudio.destination);o.start(at);o.stop(at+0.11);
    });
  }catch(e){}
}

async function renderDocs(v){
  v.innerHTML=`<div class="muted" style="padding:24px">${t('loading')}</div>`;
  await loadDocs();
  const byPid={};
  (docsData.documents||[]).forEach(d=>{(byPid[d.pid]=byPid[d.pid]||[]).push(d);});
  const q=docsSearch.trim().toLowerCase();
  const people=P().filter(p=>!q||p.fio.toLowerCase().includes(q)||p.id.toLowerCase().includes(q));
  const withDocs=people.filter(p=>byPid[p.id]);
  const without=people.filter(p=>!byPid[p.id]);
  const manage=can('manager');

  const rel=docsData.release||{};
  const held=!!docsData.hold;
  const relBlock=can('admin')?`
    <div class="card ${held?'holdon':''}" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <label class="chk"><input type="checkbox" ${held?'checked':''} onchange="setDocHold(this.checked)">
        <b>${t('docHold')}</b></label>
      <span class="muted" style="font-size:12px">${held?t('docHoldOn'):t('docHoldOff')}</span></div>
    <div class="card" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
    <div class="frow" style="margin:0"><label>${KIND_ICON.voucher} ${t('docVoucher')}</label>
      <input type="datetime-local" value="${escapeHtml(rel.voucher||'')}" onchange="setDocRelease('voucher',this.value)"></div>
    <div class="frow" style="margin:0"><label>${KIND_ICON.ticket} ${t('docTicket')}</label>
      <input type="datetime-local" value="${escapeHtml(rel.ticket||'')}" onchange="setDocRelease('ticket',this.value)"></div>
    <span class="muted" style="font-size:12px">${t('docReleaseHint')}</span></div>`:'';

  v.innerHTML=`
    ${manage?`<div class="dropzone" id="dz">
      <div class="dzi">📥</div>
      <div><b>${t('docDrop')}</b></div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">${t('docDropHint')}</div>
      <input type="file" id="dzf" multiple hidden>
      <div id="dzlog"></div></div>`:''}
    ${relBlock}
    <div class="toolbar">
      <div class="search"><span class="mag">⌕</span>
        <input id="docq" placeholder="${t('search')}" value="${escapeHtml(docsSearch)}"></div>
      <span class="muted" style="font-size:12.5px">
        ${t('docHave').replace('%n',withDocs.length)} · ${t('docNone').replace('%n',without.length)}</span>
    </div>
    <div class="card"><div id="doclist">${docRows(withDocs,byPid,manage)}</div></div>
    ${without.length?`<div class="card" style="margin-top:12px">
      <div class="lab2">${t('docMissing')}</div>
      <div class="muted" style="font-size:12.5px">${without.slice(0,60).map(p=>escapeHtml(p.fio)).join(' · ')}${without.length>60?' …':''}</div>
    </div>`:''}`;

  document.getElementById('docq').oninput=e=>{docsSearch=e.target.value;renderDocs(VW());};
  if(manage)wireDropzone();
}

function docRows(people,byPid,manage){
  if(!people.length)return `<div class="empty" style="padding:26px;text-align:center">${t('notFound')}</div>`;
  return people.map(p=>{
    const docs=byPid[p.id]||[];
    return `<div class="mrow" style="padding:10px 14px;align-items:flex-start">
      <span class="id">${p.id}</span>
      <span class="nm" style="flex:1">
        <b style="font-weight:600">${escapeHtml(p.fio)}</b>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px">
          ${docs.map(d=>`<span class="docchip${d.kind==='other'?' warn':''}">
            ${manage
              ? `<select class="kindsel" onchange="setDocKind(${d.id},this.value)" title="${t('docKind')}">
                   ${['voucher','ticket','other'].map(k=>`<option value="${k}" ${d.kind===k?'selected':''}>${KIND_ICON[k]}</option>`).join('')}
                 </select>`
              : (KIND_ICON[d.kind]||'📎')}
            <a href="/api/docs/file/${d.id}" target="_blank">${escapeHtml(d.file_name)}</a>
            <i>${(d.size/1024).toFixed(0)} KB</i>
            ${d.sent_at?`<u title="${t('docSent')}">✓</u>`:''}
            ${manage?`<b onclick="delDoc(${d.id})" title="${t('cpDel')}">✕</b>`:''}</span>`).join('')}
        </div></span>
      ${manage?`<button class="btn sm" onclick="uploadFor('${p.id}')">+ ${t('docAdd')}</button>`:''}
    </div>`;
  }).join('');
}

function wireDropzone(){
  const dz=document.getElementById('dz'), input=document.getElementById('dzf');
  if(!dz)return;
  dz.onclick=()=>input.click();
  input.onchange=()=>{sendDocs([...input.files]);input.value='';};
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files.length)
    sendDocs([...e.dataTransfer.files]); });
}

function uploadFor(pid){
  const input=document.createElement('input');
  input.type='file'; input.multiple=true;
  input.onchange=()=>sendDocs([...input.files],pid);
  input.click();
}

async function sendDocs(files,pid){
  if(!files.length||docsBusy)return;
  docsBusy=true;
  const log=document.getElementById('dzlog');
  const say=m=>{ if(log)log.innerHTML=`<div class="dzmsg">${m}</div>`; };
  // Bo'lak-bo'lak yuboramiz: 100 ta faylni bitta so'rovga tiqish shart emas.
  const CHUNK=10;
  let saved=0, unmatched=[];
  for(let i=0;i<files.length;i+=CHUNK){
    const part=files.slice(i,i+CHUNK);
    const form=new FormData();
    part.forEach(f=>form.append('files',f));
    if(pid)form.append('pid',pid);
    say(t('docUploading').replace('%a',Math.min(i+CHUNK,files.length)).replace('%b',files.length));
    try{
      const r=await fetch('/api/docs/upload',{method:'POST',body:form});
      if(r.status===401){showGate();break;}
      if(r.status===403){toast(t('noRight'));break;}
      const j=await r.json();
      saved+=(j.saved||[]).length;
      unmatched=unmatched.concat(j.unmatched||[]);
    }catch(e){ unmatched=unmatched.concat(part.map(f=>f.name)); }
  }
  docsBusy=false;
  await renderDocs(VW());
  const box=document.getElementById('dzlog');
  if(box)box.innerHTML=`<div class="dzmsg ok">✅ ${t('docSaved').replace('%n',saved)}</div>`
    +(unmatched.length?`<div class="dzmsg bad">⚠️ ${t('docUnmatched')}:<br>${unmatched.map(escapeHtml).join('<br>')}</div>`:'');
  toast(t('docSaved').replace('%n',saved));
}

// Fayl nomida "voucher"/"ticket" so'zi bo'lmasa turi "other" bo'lib qoladi —
// shu yerdan bir bosishda to'g'rilanadi.
async function setDocKind(id,kind){
  const ok=await api._post('/api/docs/assign',{id,kind});
  if(ok===false)return;
  const d=(docsData.documents||[]).find(x=>x.id===id); if(d)d.kind=kind;
  toast(t('saved'));
}

async function delDoc(id){
  if(!confirm(t('docDelQ')))return;
  const ok=await api._post('/api/docs/delete',{id});
  if(ok===false)return;
  renderDocs(VW());
}

// Hujjat turiga biriktirilgan xabar — bot uni fayldan oldin yuboradi.
// Har til alohida: panel tili almashtirilsa o'sha tildagi matn tahrirlanadi.
function noteFor(kind){
  const v=(docsData.note||{})[kind];
  if(!v)return '';
  return (typeof v==='object') ? (v[S.lang]||'') : (S.lang==='uz'?v:'');
}
async function setDocNote(kind,text){
  const ok=await api._post('/api/docs/note',{kind,lang:S.lang,text});
  if(ok===false)return;
  const note=docsData.note||(docsData.note={});
  const cur=(typeof note[kind]==='object'&&note[kind])||{};
  cur[S.lang]=text; note[kind]=cur;

// Fayllarni yuklab bo'lgunicha tarqatishni to'xtatib turish.
async function setDocHold(on){
  const ok=await api._post('/api/docs/release',{hold:on});
  if(ok===false)return;
  docsData.hold=on; renderDocs(VW()); toast(t('saved'));
}

async function setDocRelease(kind,value){
  const rel=Object.assign({},docsData.release||{});
  if(value)rel[kind]=value; else delete rel[kind];
  const ok=await api._post('/api/docs/release',{release:rel});
  if(ok===false)return;
  docsData.release=rel; toast(t('saved'));
}

/* ===== QR KODLAR ===== */
// QR ichida pasportdan olingan token turadi, ochiq ACO id emas.
// Eski ID li havolalar ham ochiladi, ya'ni chop etilgan beyjiklar ishlashda davom etadi.
function pageUrl(id){
  const base=(S.pageBase||location.origin||'').replace(/\/+$/,'');
  const p=(S.participants||[]).find(x=>x.id===id);
  return (base||'')+'/p/'+encodeURIComponent((p&&p.token)||id);
}
function fillQR(root){root.querySelectorAll('canvas[data-qr]').forEach(cv=>{
  new QRious({element:cv,value:pageUrl(cv.dataset.qr),size:300,level:'M',foreground:'#211F52',background:'#ffffff'});});}

let qrSearch='', qrSize=1024, qrLabel=true;

function renderQR(v){
  const q=qrSearch.trim().toLowerCase();
  const list=P().filter(p=>!q||p.fio.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)
                            ||String(p.group||'').includes(q));
  v.innerHTML=`
    <div class="toolbar">
      <div class="search"><span class="mag">⌕</span>
        <input id="qrq" placeholder="${t('search')}" value="${escapeHtml(qrSearch)}"></div>
      <select id="qrsize" onchange="qrSize=+this.value">
        ${[512,1024,2048].map(s=>`<option value="${s}"${s===qrSize?' selected':''}>${s}×${s} px</option>`).join('')}
      </select>
      <label class="chk"><input type="checkbox" id="qrlabel" ${qrLabel?'checked':''}
        onchange="qrLabel=this.checked"> ${t('qrWithName')}</label>
      <button class="btn pri" id="qrall">⬇ ${t('qrAll')} (${list.length})</button>
    </div>
    <div class="muted" style="margin:0 0 14px;font-size:12.5px">${t('qrHint')}</div>
    <div class="qrgrid" id="qrgrid">
      ${list.map(p=>`
        <div class="qrcard">
          <canvas data-qr="${p.id}" width="300" height="300"></canvas>
          <div class="qrname">${escapeHtml(p.fio)}</div>
          <div class="qrmeta">${p.id}${p.group?' · '+t('grp')+' '+p.group:''}</div>
          <button class="btn sm" onclick="downloadQR('${p.id}')">⬇ PNG</button>
        </div>`).join('')||`<div class="empty" style="padding:26px">${t('notFound')}</div>`}
    </div>`;
  fillQR(v);
  document.getElementById('qrq').oninput=e=>{qrSearch=e.target.value;renderQR(document.getElementById('view'));};
  document.getElementById('qrall').onclick=()=>downloadAllQR(list);
}

/* Bitta QR ni PNG holida chizadi: kod + (xohlasa) ism-familya va ACO raqami. */
function qrPng(p,size,withLabel){
  const pad=Math.round(size*0.06), foot=withLabel?Math.round(size*0.16):0;
  const cv=document.createElement('canvas');
  cv.width=size+pad*2; cv.height=size+pad*2+foot;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
  const src=document.createElement('canvas');
  new QRious({element:src,value:pageUrl(p.id),size:size,level:'M',
              foreground:'#211F52',background:'#ffffff'});
  ctx.drawImage(src,pad,pad);
  if(withLabel){
    const base=size+pad*2;
    ctx.fillStyle='#211F52'; ctx.textAlign='center';
    ctx.font=`700 ${Math.round(size*0.062)}px Inter,Arial,sans-serif`;
    ctx.fillText(p.fio,cv.width/2,base+Math.round(size*0.06),cv.width-pad*2);
    ctx.fillStyle='#7A7990';
    ctx.font=`600 ${Math.round(size*0.045)}px Inter,Arial,sans-serif`;
    const meta=p.id+(p.group?' · '+t('grp')+' '+p.group:'');
    ctx.fillText(meta,cv.width/2,base+Math.round(size*0.125),cv.width-pad*2);
  }
  return cv;
}

function safeName(p){
  return (p.id+'_'+p.fio).replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').slice(0,80);
}

function canvasBlob(cv){return new Promise(res=>cv.toBlob(res,'image/png'));}

async function downloadQR(id){
  const p=find(id); if(!p)return;
  const blob=await canvasBlob(qrPng(p,qrSize,qrLabel));
  saveBlob(blob,safeName(p)+'.png');
  toast(t('saved'));
}

function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ZIP (siqishsiz "store") — PNG allaqachon siqilgan, shuning uchun kutubxona kerak emas. */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(buf){let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}

function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const local=new Uint8Array(30+name.length), lv=new DataView(local.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,size,true); lv.setUint32(22,size,true);
    lv.setUint16(26,name.length,true);
    local.set(name,30);
    parts.push(local,f.data);
    const cd=new Uint8Array(46+name.length), cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,size,true); cv.setUint32(24,size,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
    cd.set(name,46);
    central.push(cd);
    offset+=local.length+size;
  });
  const cdSize=central.reduce((n,c)=>n+c.length,0);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

async function downloadAllQR(list){
  const btn=document.getElementById('qrall'); if(btn){btn.disabled=true;}
  const files=[];
  for(let i=0;i<list.length;i++){
    const p=list[i];
    const blob=await canvasBlob(qrPng(p,qrSize,qrLabel));
    files.push({name:safeName(p)+'.png',data:new Uint8Array(await blob.arrayBuffer())});
    if(btn)btn.textContent=`⏳ ${i+1}/${list.length}`;
  }
  saveBlob(zipStore(files),'acoustic2026-qr.zip');
  if(btn){btn.disabled=false;btn.textContent=`⬇ ${t('qrAll')} (${list.length})`;}
  toast(t('saved'));
}

/* ===== kirish (maxfiy kod) ===== */
const ROLE_LABEL={admin:{uz:"Texnik admin",ru:"Тех. админ"},manager:{uz:"Rahbar",ru:"Руководитель"},
                  leader:{uz:"Guruh mas'uli",ru:"Староста группы"},member:{uz:"Ishtirokchi",ru:"Участник"}};
const GATE_ERR={
  not_found:{uz:"Kod topilmadi. Tekshirib qayta kiriting.",ru:"Код не найден. Проверьте и повторите."},
  too_short:{uz:"Kod juda qisqa.",ru:"Код слишком короткий."},
  ambiguous:{uz:"Kod bir nechta odamga to'g'ri keldi \u2014 to'liq holida yozing.",
             ru:"Код подошёл нескольким \u2014 введите полностью."},
  too_many_attempts:{uz:"Juda ko'p urinish. 10 daqiqadan keyin qayta urining.",
                     ru:"Слишком много попыток. Повторите через 10 минут."},
  network:{uz:"Aloqa xatosi. Qayta urining.",ru:"Ошибка связи. Повторите."}
};

function showGate(){
  document.getElementById('gate').classList.add('show');
  const box=document.getElementById('gateCode');
  box.value=''; box.focus();
}

function renderWhoami(){
  const el=document.getElementById('whoami'); if(!el||!S.user)return;
  const role=(ROLE_LABEL[S.user.role]||{})[S.lang]||S.user.role;
  el.innerHTML=`<span><b>${escapeHtml(S.user.fio||'')}</b> · ${role}</span>`+
    `<button class="out" onclick="logout()">${S.lang==='ru'?'Выйти':'Chiqish'}</button>`;
}

async function logout(){
  try{await fetch('/api/auth/logout',{method:'POST'});}catch(e){}
  location.reload();
}

async function submitCode(){
  const input=document.getElementById('gateCode'), btn=document.getElementById('gateGo'),
        err=document.getElementById('gateErr');
  const code=input.value.trim();
  if(!code)return;
  btn.disabled=true; err.textContent='';
  let body={};
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:H,body:JSON.stringify({code})});
    body=await r.json().catch(()=>({}));
    if(r.ok){location.reload();return;}
  }catch(e){ body={error:'network'}; }
  btn.disabled=false;
  err.textContent=(GATE_ERR[body.error]||GATE_ERR.not_found)[S.lang]||'';
  input.select();
}

/* ===== boot ===== */
(async function(){
  document.getElementById('gateGo').onclick=submitCode;
  document.getElementById('gateCode').onkeydown=e=>{if(e.key==='Enter')submitCode();};

  const data=await api.boot();
  if(!data||data.unauthorized){ showGate(); return; }

  S.user=data.user||null;
  S.participants=(data.participants||[]).map(p=>({group:null,leader:false,room:'',branch:'',telegram:'',roles:[],...p}));
  S.checkins=data.checkins||{};S.seminarLogo=data.seminarLogo||null;
  S.checkpoints=data.checkpoints||[];S.program=data.program||[];S.roles=data.roles||[];
  S.meta=data.meta||{};S.pageBase=data.pageBase||null;S.groups=data.groups||[];S.tz=data.tz??3;

  if(!S.checkpoints.length)S.checkpoints=DEF_CPS.map(c=>({...c}));
  if(!S.roles.length)S.roles=DEF_ROLES.map(r=>({...r}));
  if(!S.meta||!S.meta.title)S.meta={...DEF_META};
  S.checkpoints.forEach(c=>{if(!S.checkins[c.key])S.checkins[c.key]={};});
  activeCP=(S.checkpoints[0]||{}).key||'';

  const mt=document.getElementById('modeTag');
  // Versiya belgisi: brauzerdagi sahifa eskirib qolganini shu bilan aniqlaymiz.
  mt.innerHTML=`<span class="dot" style="background:#12B886"></span>Server`
    + (data.build?`<div style="opacity:.6;font-size:10px;margin-top:3px">v ${data.build}</div>`:'');
  try{const saved=localStorage.getItem('sharm_ui_lang');if(UI_LANGS.includes(saved))S.lang=saved;}catch(e){}
  renderLangBar();
  render();
})();
