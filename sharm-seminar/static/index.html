<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acoustic · Sharm seminar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
:root{
  --indigo:#2E2C6E; --indigo-2:#3F3C8F; --indigo-ink:#211F52;
  --orange:#F07E1A; --orange-2:#E06A0A; --orange-soft:#FDEBD8;
  --bg:#F4F5F9; --surface:#FFFFFF; --ink:#1B1A2E; --muted:#6C6B80;
  --line:#E6E7F1; --line-2:#D9DAE8;
  --rt-single:#FFF2B2; --rt-double:#D1E8FF; --rt-triple:#D1F2D1; --rt-posh:#E5D1F4;
  --g1:#5B7CFA; --g2:#F07E1A; --g3:#12B886; --g4:#E4508B; --g5:#8A63D2;
  --ok:#12B886; --shadow:0 1px 2px rgba(33,31,82,.06),0 8px 24px rgba(33,31,82,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--indigo);color:#EDECF7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.10)}
.brand img{height:26px;background:#fff;border-radius:6px;padding:5px 7px}
.brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B7B5E0;margin-top:3px}
.brand b{font-size:13px;font-weight:700;letter-spacing:.02em}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#C9C7EC;font-size:13.5px;font-weight:500;text-align:left;transition:.13s}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--indigo);font-weight:600}
.side .foot{padding:14px;font-size:11px;color:#8886BE;border-top:1px solid rgba(255,255,255,.10)}
.side .foot .mode{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-weight:600}
.wave path{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round}

.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(244,245,249,.82);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--indigo-ink)}
.top .desc{font-size:12.5px;color:var(--muted);margin-top:1px}
.top .sp{flex:1}
.lang{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.lang button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--indigo);color:#fff}
.view{padding:24px 26px 60px;max-width:1220px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:.13s}
.btn:hover{border-color:var(--indigo);color:var(--indigo)}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.pri:hover{background:var(--indigo-ink)}
.btn.acc{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.acc:hover{background:var(--orange-2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-2)}
.muted{color:var(--muted)}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{padding:18px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--indigo-ink);margin-top:6px;line-height:1}
.stat .n{font-size:12px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.panel{padding:18px 20px}
.panel h3{font-size:14px;font-weight:700;color:var(--indigo-ink)}
.panel .ph{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin:11px 0}
.bar-row .lbl{width:120px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.bar{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-row .val{width:66px;text-align:right;font-size:12.5px;font-weight:700;color:var(--indigo-ink)}
.cp-row .lbl{width:132px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.search .mag{position:absolute;left:11px;top:9px;color:var(--muted)}
select.f{padding:8px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:500}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAFE}
.id{font-size:11.5px;font-weight:700;color:var(--indigo);letter-spacing:.02em}
.rg{font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:6px}
.gsel{padding:5px 8px;border:1px solid var(--line-2);border-radius:7px;font-weight:600;font-size:12.5px;background:var(--surface)}
.star{font-size:16px;line-height:1;padding:3px 6px;border-radius:6px}
.star.on{color:var(--orange)}.star.off{color:var(--line-2)}
.leadtag{font-size:10px;font-weight:800;color:#fff;background:var(--orange);padding:1px 6px;border-radius:5px;letter-spacing:.04em}
.cellinput{width:100%;max-width:130px;padding:5px 8px;border:1px solid var(--line-2);border-radius:7px}

.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.grp{padding:0;overflow:hidden}
.grp .hd{padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.grp .hd .t{font-size:15px;font-weight:700}
.grp .hd .c{font-size:12px;font-weight:600;opacity:.9}
.grp .bd{max-height:340px;overflow-y:auto}
.grp .mrow{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.grp .mrow:last-child{border-bottom:none}
.grp .mrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .mrow .setlead{font-size:15px;color:var(--line-2)}
.grp .mrow .setlead.on{color:var(--orange)}
.grp .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- badge designer ---------- */
.des{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.des-stage-wrap{background:linear-gradient(135deg,#EDEEF6,#F7F8FC);border:1px solid var(--line);border-radius:16px;
  padding:26px;display:flex;justify-content:center;box-shadow:var(--shadow);overflow:auto}
.stage{transform-origin:top center}
.badge-box{position:relative;overflow:hidden;border-radius:3mm;box-shadow:0 6px 26px rgba(33,31,82,.22)}
.badge-box.editing .be{cursor:grab}
.badge-box.editing .be:hover{outline:1.5px solid rgba(46,44,110,.35)}
.badge-box.editing .be.sel{outline:2px dashed var(--orange);outline-offset:1px}
.be{position:absolute}
.betext{overflow:hidden;white-space:pre-wrap;word-break:break-word}
.badge-box.editing .betext[contenteditable=true]{cursor:text;outline:2px solid #5B7CFA!important;background:rgba(255,255,255,.92);padding:1mm;z-index:20}
.beqr canvas{display:block}
.punch{position:absolute;top:2.5mm;left:50%;transform:translateX(-50%);width:14mm;height:3mm;border-radius:2mm;
  background:rgba(0,0,0,.12);border:.4mm solid rgba(0,0,0,.18)}

.props{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
.pblock{padding:14px 16px}
.pblock h4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-2);margin-bottom:12px}
.addrow{display:flex;flex-wrap:wrap;gap:7px}
.addrow .btn{padding:7px 10px;font-size:12px}
.frow{display:flex;align-items:center;gap:10px;margin:9px 0}
.frow label{width:70px;font-size:12px;font-weight:600;color:var(--muted)}
.frow input[type=number],.frow input[type=text],.frow select,.frow textarea{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line-2);border-radius:8px;background:#fff}
.frow textarea{min-height:72px;resize:vertical;font:inherit;line-height:1.35}
.hint{font-size:11px;color:var(--muted);line-height:1.4;margin-top:7px}
.frow input[type=color]{width:38px;height:30px;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:#fff}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:1}
.seg button{flex:1;padding:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--indigo);color:#fff}
.nofocus{color:var(--muted);font-size:12.5px;text-align:center;padding:12px 0}
.logo-up{display:flex;align-items:center;gap:10px}
.logo-up .prev{width:44px;height:44px;border:1px solid var(--line-2);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.logo-up .prev img{max-width:100%;max-height:100%}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--indigo-ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.burger{display:none;font-size:20px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line-2)}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,19,50,.4);z-index:55}
.scrim.show{display:block}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;z-index:60;width:236px;transition:.2s}
  .side.open{left:0}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .des{grid-template-columns:1fr}
  .props{position:static}
  .burger{display:inline-flex!important}
}

/* ---------- print ---------- */
#printwrap{display:none}
@media print{
  .app,.scrim,.toast{display:none!important}
  #printwrap{display:flex!important;flex-wrap:wrap;gap:0}
  .pbadge{position:relative;overflow:hidden;page-break-after:always;outline:.2mm solid #ccc}
  @page{margin:8mm;size:auto}
}
</style>
</head>

/* ===== api layer (server -> localStorage -> memory) ===== */
const api={
 mode:'memory',
 async boot(){
   try{const r=await fetch('/api/bootstrap',{cache:'no-store'});
     if(r.ok){this.mode='server';return await r.json();}}catch(e){}
   try{const raw=localStorage.getItem('sharm');this.mode='local';
     if(raw)return JSON.parse(raw);}catch(e){this.mode='memory';}
   return null;
 },
 saveLocal(){ if(this.mode!=='local')return;
   try{localStorage.setItem('sharm',JSON.stringify(
     {participants:S.participants,checkins:S.checkins,checkpoints:S.checkpoints,program:S.program,
      roles:S.roles,meta:S.meta,badge:S.badge,seminarLogo:S.seminarLogo,pageBase:S.pageBase}));}catch(e){} },
 async _post(url,body){ if(this.mode==='server'){try{await fetch(url,{method:'POST',headers:H,body:JSON.stringify(body)});}catch(e){}} else this.saveLocal(); },
 async patch(id,patch){ return this._post('/api/participant',{id,patch}); },
 async bulk(items){ return this._post('/api/participants/bulk',{items}); },
 async checkin(id,cp,on){ if(this.mode==='server'){try{const r=await fetch('/api/checkin',{method:'POST',headers:H,body:JSON.stringify({id,checkpoint:cp,on})});const j=await r.json();return j.ts;}catch(e){}} else this.saveLocal(); return on?nowHM():null; },
 async saveBadge(){ return this._post('/api/badge',S.badge); },
 async saveCheckpoints(){ return this._post('/api/checkpoints',{checkpoints:S.checkpoints}); },
 async saveProgram(){ return this._post('/api/program',S.program); },
 async saveRoles(){ return this._post('/api/roles',S.roles); },
 async saveMeta(){ return this._post('/api/meta',S.meta); },
 async savePageBase(){ return this._post('/api/pagebase',{base:S.pageBase}); },
 async saveLogo(u){ if(this.mode==='server'){try{await fetch('/api/seminar-logo',{method:'POST',headers:H,body:JSON.stringify({dataUrl:u})});}catch(e){}} else this.saveLocal(); }
};
const nowHM=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());};

function cpCount(k){return Object.keys(S.checkins[k]||{}).length;}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

let fSearch='',fGroup='',fRoom='';
function renderParts(v){
  v.innerHTML=`<div class="toolbar">
    <div class="search"><span class="mag">⌕</span><input id="q" placeholder="${t('search')}" value="${fSearch}"></div>
    <select class="f" id="fg"><option value="">${t('allGroups')}</option>
      ${[1,2,3,4,5].map(g=>`<option value="${g}" ${fGroup==g?'selected':''}>${t('grp')} ${g}</option>`).join('')}
      <option value="0" ${fGroup=='0'?'selected':''}>${t('noGroup')}</option></select>
    <select class="f" id="fr"><option value="">${t('allRooms')}</option>
      ${['1 kishilik','2 kishilik','3 kishilik','Posh club'].map(r=>`<option ${fRoom==r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="tablewrap"><table><thead><tr>
      <th>ID</th><th>F.I.O.</th><th>${t('room')}</th><th>${t('roommate')}</th><th>${t('arrival')}</th>
      <th style="width:96px">${t('grp')}</th><th style="width:70px">${t('leaderCol')}</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  document.getElementById('q').oninput=e=>{fSearch=e.target.value;fillRows();};
  document.getElementById('fg').onchange=e=>{fGroup=e.target.value;fillRows();};
  document.getElementById('fr').onchange=e=>{fRoom=e.target.value;fillRows();};
  fillRows();

function filtered(){const q=fSearch.trim().toLowerCase();
  return P().filter(p=>{
    if(q&&!(p.fio.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)))return false;
    if(fGroup==='0'&&p.group)return false;
    if(fGroup&&fGroup!=='0'&&String(p.group)!==fGroup)return false;
    if(fRoom&&p.xona_turi!==fRoom)return false;return true;});}
function fillRows(){const tb=document.getElementById('tb');if(!tb)return;
  tb.innerHTML=filtered().map(p=>{
    const fc=p.kelish==='Chet eldan alohida'
      ?`<span class="chip" style="background:#FFE0E0;color:#B00000"><span class="dot" style="background:#B00000"></span>${t('foreign')}</span>`
      :`<span class="muted" style="font-size:12px">Umumiy</span>`;
    const roleChips=(p.roles||[]).map(rid=>{const r=roleById(rid);return r?`<span class="chip" style="background:${r.color}1f;color:${r.color};font-size:10px;padding:1px 7px">${escapeHtml(r.label)}</span>`:'';}).join(' ');
    return `<tr><td><span class="id">${p.id}</span></td>
      <td><b style="font-weight:600">${escapeHtml(p.fio)}</b> <a href="${pageUrl(p.id)}" target="_blank" title="${t('openPage')}" style="text-decoration:none;color:var(--muted);font-size:11px">↗</a>
      <div style="margin-top:2px;display:flex;gap:4px;flex-wrap:wrap;align-items:center"><span class="muted" style="font-size:11px">${p.fuqarolik}</span>${roleChips}</div></td>
      <td><span class="rg" style="background:${RTCOL[p.xona_turi]}">${p.xona_turi}</span></td>
      <td><span class="muted tnum">${p.xona_guruhi}</span></td><td>${fc}</td>
      <td><select class="gsel" onchange="setGroup('${p.id}',this.value)"><option value="">—</option>
        ${[1,2,3,4,5].map(g=>`<option value="${g}" ${p.group==g?'selected':''}>${t('grp')} ${g}</option>`).join('')}</select></td>
      <td>${p.group?`<button class="star ${p.leader?'on':'off'}" onclick="toggleLeader('${p.id}')">${p.leader?'★':'☆'}</button>`:'<span class="muted">—</span>'}</td></tr>`;
  }).join('')||`<tr><td colspan="7" class="muted" style="padding:30px;text-align:center">${t('notFound')}</td></tr>`;
}
function setGroup(id,g){const p=find(id);p.group=g?+g:null;if(!p.group)p.leader=false;
  api.patch(id,{group:p.group,leader:p.leader});toast(t('saved'));if(VIEW==='parts')fillRows();}
function toggleLeader(id){const p=find(id);if(!p.group)return;
  if(!p.leader)P().forEach(x=>{if(x.group===p.group)x.leader=false;});
  p.leader=!p.leader;api.patch(id,{leader:p.leader,group:p.group});toast(t('saved'));
  if(VIEW==='parts')fillRows();else if(VIEW==='groups')render();}

/* ===== groups ===== */
function renderGroups(){
  const cards=[1,2,3,4,5].map(g=>{
    const mem=P().filter(p=>p.group===g).sort((a,b)=>(b.leader-a.leader)||a.fio.localeCompare(b.fio));
    const body=mem.length?mem.map(p=>`<div class="mrow">
      <button class="setlead ${p.leader?'on':''}" onclick="toggleLeader('${p.id}')">${p.leader?'★':'☆'}</button>
      <span class="nm">${escapeHtml(p.fio)}${p.leader?` <span class="leadtag">${t('leaderTag')}</span>`:''}</span>
      <span class="muted tnum" style="font-size:11px">${p.xona_guruhi}</span></div>`).join(''):`<div class="empty">${t('noMembers')}</div>`;
    return `<div class="card grp"><div class="hd" style="background:${GCOL[g]}"><div class="t">${t('grp')} ${g}</div><div class="c">${mem.length} ${t('member')}</div></div><div class="bd">${body}</div></div>`;
  }).join('');
  return `<div class="toolbar"><button class="btn acc" onclick="autoDist()">✦ ${t('autoDist')}</button>
    <button class="btn" onclick="clearGroups()">${t('clearAll')}</button>
    <span class="muted" style="font-size:12.5px">${t('vdesc_groups')}</span></div><div class="grp-grid">${cards}</div>`;
}
function autoDist(){
  const byRoom={};P().forEach(p=>{(byRoom[p.xona_guruhi]=byRoom[p.xona_guruhi]||[]).push(p);});
  const rooms=Object.values(byRoom).sort((a,b)=>b.length-a.length);const counts=[0,0,0,0,0];
  rooms.forEach(room=>{let mi=0;for(let i=1;i<5;i++)if(counts[i]<counts[mi])mi=i;
    room.forEach(p=>{p.group=mi+1;p.leader=false;});counts[mi]+=room.length;});
  api.bulk(P().map(p=>({id:p.id,group:p.group,leader:p.leader})));toast(t('distDone'));render();
}

let ciSearch='';
function renderCheckin(v){
  if(!CPS().some(c=>c.key===activeCP))activeCP=(CPS()[0]||{}).key;
  v.innerHTML=`<div class="toolbar" style="gap:8px">${CPS().map(c=>`
    <button class="btn ${activeCP===c.key?'pri':''}" style="flex-direction:column;align-items:flex-start;min-width:140px;position:relative" onclick="setCP('${c.key}')">
      <span style="font-weight:700">${c.icon||'•'} ${escapeHtml(c.label)}</span>
      <span style="font-size:11.5px;opacity:.8"><span class="tnum">${cpCount(c.key)}</span>/${P().length} ${t('checkedIn')}</span>
      <span onclick="event.stopPropagation();delCP('${c.key}')" title="${t('cpDel')}" style="position:absolute;top:4px;right:6px;font-size:12px;color:#C0392B;opacity:.6">✕</span></button>`).join('')}
    <button class="btn" onclick="addCP()" style="min-width:auto">${t('cpAdd')}</button></div>
    <div class="toolbar">
      <input id="scan" placeholder="${t('scanPh')}" autocomplete="off" style="flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;font-weight:600">
      <div class="search"><span class="mag">⌕</span><input id="ciq" placeholder="${t('search')}" value="${ciSearch}"></div></div>
    <div class="card"><div id="cil"></div></div>`;
  const sc=document.getElementById('scan');if(!sc)return;
  sc.onkeydown=e=>{if(e.key==='Enter'){const raw=sc.value.trim().toUpperCase().replace(/[^0-9]/g,'');
    const p=P().find(x=>x.id.replace(/[^0-9]/g,'')===raw||x.id.toUpperCase()===sc.value.trim().toUpperCase());
    if(p){doCheck(p.id,!(S.checkins[activeCP]||{})[p.id]);sc.value='';}else{toast(t('notFound'));sc.select();}}};
  document.getElementById('ciq').oninput=e=>{ciSearch=e.target.value;fillCI();};
  fillCI();sc.focus();
}
function setCP(k){activeCP=k;renderCheckin(document.getElementById('view'));}
function fillCI(){const cil=document.getElementById('cil');if(!cil)return;
  const q=ciSearch.trim().toLowerCase();const map=S.checkins[activeCP]||{};
  const list=P().filter(p=>!q||p.fio.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)).slice(0,80);
  cil.innerHTML=list.map(p=>{const on=!!map[p.id];
    const room=activeCP==='mehmonxona'?`<input class="cellinput" placeholder="${t('roomNo')}" value="${p.room||''}" onchange="setRoom('${p.id}',this.value)">`:'';
    return `<div class="mrow" style="padding:10px 14px"><span class="id">${p.id}</span>
      <span class="nm" style="flex:1"><b style="font-weight:600">${escapeHtml(p.fio)}</b>
      <div class="muted" style="font-size:11.5px">${p.xona_turi} · ${p.xona_guruhi} · ${p.group?t('grp')+' '+p.group:t('noGroup')}</div></span>
      ${room}${on?`<span style="font-size:11.5px;color:var(--ok);font-weight:700">✓ ${map[p.id]}</span>`:''}
      <button class="btn sm ${on?'':'pri'}" onclick="doCheck('${p.id}',${!on})">${on?t('notYet'):'✓ '+t('checkedIn')}</button></div>`;
  }).join('')||`<div class="empty" style="padding:26px;text-align:center">${t('notFound')}</div>`;
}
async function doCheck(id,on){const ts=await api.checkin(id,activeCP,on);const map=S.checkins[activeCP]=S.checkins[activeCP]||{};
  if(on){map[id]=ts||nowHM();toast(find(id).fio+' — '+cpName(activeCP)+': '+t('pos'));}
  else{delete map[id];toast(find(id).fio+' — '+t('neg'));}
  renderCheckin(document.getElementById('view'));}
function setRoom(id,val){find(id).room=val;api.patch(id,{room:val});toast(t('saved'));}
function addCP(){const label=prompt(t('cpAddQ'));if(!label)return;
  const icon=prompt(t('cpIconQ'),'📍')||'📍';
  const key='cp_'+Math.random().toString(36).slice(2,7);
  S.checkpoints.push({key,label:label.trim(),icon:icon.trim()});S.checkins[key]={};
  activeCP=key;api.saveCheckpoints();renderCheckin(document.getElementById('view'));}
function delCP(key){if(!confirm(t('cpDelQ')))return;
  S.checkpoints=S.checkpoints.filter(c=>c.key!==key);delete S.checkins[key];
  api.saveCheckpoints();renderCheckin(document.getElementById('view'));}

function getEl(id){return S.badge.elements.find(e=>e.id===id);}
function sampleP(){return P()[sampleIdx]||P()[0];}
function badgeInner(p){
  const logo=S.seminarLogo||ACOUSTIC;
  return S.badge.elements.map(e=>{
    const pos=`left:${e.x}mm;top:${e.y}mm;`;
    if(e.type==='band')return `<div class="be" data-eid="${e.id}" style="${pos}width:${e.w}mm;height:${e.h}mm;background:${e.color}"></div>`;
    if(e.type==='logo'){const src=e.src||logo;return `<div class="be" data-eid="${e.id}" style="${pos}width:${e.w}mm"><img src="${src}" style="width:100%;display:block;max-height:${e.h||40}mm;object-fit:contain"></div>`;}
    if(e.type==='qr')return `<div class="be beqr" data-eid="${e.id}" style="${pos}width:${e.w}mm;height:${e.w}mm"><canvas data-qr="${p.id}" style="width:100%;height:100%"></canvas></div>`;
    const txt=e.type==='field'?(e.field==='name'?p.fio:p.id):e.text;
    const ls=e.letter?`letter-spacing:${e.letter}px;`:'';
    const font=e.font||'Inter,Arial,sans-serif',lh=e.lineHeight||1.05,italic=e.italic?'italic':'normal';
    return `<div class="be betext" data-eid="${e.id}" data-etype="${e.type}" style="${pos}width:${e.w}mm;font-size:${e.size}mm;color:${e.color};font-family:${font};font-style:${italic};font-weight:${e.weight};text-align:${e.align};${ls}line-height:${lh}">${escapeHtml(txt)}</div>`;
  }).join('');

function fillQR(root){root.querySelectorAll('canvas[data-qr]').forEach(cv=>{

function bindDrag(){
  document.querySelectorAll('#ebox .be').forEach(el=>{
    const model=getEl(el.dataset.eid);
    if(model&&model.type==='text')el.ondblclick=ev=>startInlineTextEdit(el,model,ev);
    el.onpointerdown=ev=>{ev.preventDefault();selEid=el.dataset.eid;markSel();renderProps();
      const e=getEl(selEid);const sx=e.x,sy=e.y,dx=ev.clientX,dy=ev.clientY;const sc=editorScale();
      const move=m=>{e.x=Math.max(-2,Math.min(bw(),sx+(m.clientX-dx)/(PXMM*sc)));
        e.y=Math.max(-2,Math.min(bh(),sy+(m.clientY-dy)/(PXMM*sc)));
        el.style.left=e.x.toFixed(1)+'mm';el.style.top=e.y.toFixed(1)+'mm';syncNum('px',e.x);syncNum('py',e.y);};
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);api.saveBadge();};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);};
  });
}
function startInlineTextEdit(el,e,ev){
  ev.preventDefault();ev.stopPropagation();
  el.onpointerdown=null;el.contentEditable='true';el.spellcheck=true;el.focus();
  const range=document.createRange();range.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  const save=()=>{e.text=el.innerText.replace(/\n+$/,'');el.contentEditable='false';api.saveBadge();refreshStage();renderProps();};
  el.onblur=save;el.onkeydown=k=>{if(k.key==='Escape'){k.preventDefault();el.innerText=e.text;el.blur();}
    if(k.key==='Enter'&&!k.shiftKey){k.preventDefault();el.blur();}};
}
function markSel(){document.querySelectorAll('#ebox .be').forEach(el=>el.classList.toggle('sel',el.dataset.eid===selEid));}

    const logoSrc=e.src||(S.seminarLogo||ACOUSTIC);
    f+=`<div class="frow" style="align-items:flex-start"><label>${t('logoImage')}</label><div class="logo-up"><div class="prev"><img src="${logoSrc}"></div><label class="btn sm" style="cursor:pointer">${t('uploadThisLogo')}<input type="file" accept="image/*" style="display:none" onchange="uploadElementLogo(this,'${e.id}')"></label></div></div>
      <div class="frow"><label>${t('width')}</label><input type="number" step="1" value="${e.w}" oninput="setProp('${e.id}','w',this.value,true)"></div>
      <div class="frow"><label>${t('height')}</label><input type="number" step="1" value="${e.h||40}" oninput="setProp('${e.id}','h',this.value,true)"></div>
      ${e.src?`<button class="btn sm" onclick="setProp('${e.id}','src','')">↺ ${t('useDefaultLogo')}</button>`:''}`;
  }else if(e.type==='band'){
    f+=`<div class="frow"><label>${t('width')}</label><input type="number" step="1" value="${e.w}" oninput="setProp('${e.id}','w',this.value,true)"></div>
      <div class="frow"><label>${t('height')}</label><input type="number" step="0.5" value="${e.h}" oninput="setProp('${e.id}','h',this.value,true)"></div>
      <div class="frow"><label>${t('color')}</label><input type="color" value="${e.color}" oninput="setProp('${e.id}','color',this.value,true)"></div>`;
  }
  f+=`<button class="btn sm" style="margin-top:8px;color:#C0392B;border-color:#F3C6C0" onclick="delEl('${e.id}')">🗑 ${t('delEl')}</button>`;
  return f;
}
function setProp(id,key,val,noRerender){const e=getEl(id);
  if(['x','y','w','h','size','letter','lineHeight'].includes(key))val=parseFloat(val)||0;
  e[key]=val;api.saveBadge();
  if(noRerender){refreshStageOnly();}else{refreshStage();renderProps();}
}
function refreshStage(){const box=document.getElementById('ebox');if(!box)return;
  box.style.background=S.badge.bg;
  box.innerHTML=`<div class="punch"></div>`+badgeInner(sampleP());
  fillQR(box);bindDrag();markSel();}
function refreshStageOnly(){const box=document.getElementById('ebox');if(!box)return;
  box.innerHTML=`<div class="punch"></div>`+badgeInner(sampleP());fillQR(box);bindDrag();markSel();}
function addEl(type,field){
  const id='e_'+Math.random().toString(36).slice(2,7);
  const base={id,type,x:25,y:50};
  if(type==='field')Object.assign(base,{field:field||'name',w:40,size:6,color:'#211F52',weight:700,align:'center',font:'Inter,Arial,sans-serif',lineHeight:1.05,italic:false});
  if(type==='text')Object.assign(base,{text:'MATN',w:40,size:5,color:'#2E2C6E',weight:700,align:'center',letter:0,font:'Inter,Arial,sans-serif',lineHeight:1.05,italic:false});
  if(type==='qr')Object.assign(base,{w:22});
  if(type==='logo')Object.assign(base,{w:24,h:40,src:''});
  if(type==='band')Object.assign(base,{w:70,h:8,color:'#F07E1A',x:0});
  S.badge.elements.push(base);selEid=id;api.saveBadge();refreshStage();renderProps();
}
function delEl(id){S.badge.elements=S.badge.elements.filter(e=>e.id!==id);selEid=null;api.saveBadge();refreshStage();renderProps();}
function setSize(w,h){w=Math.max(40,Math.min(150,+w||70));h=Math.max(40,Math.min(200,+h||110));
  S.badge.w=w;S.badge.h=h;api.saveBadge();renderDesigner(document.getElementById('view'));}
function resetTpl(){S.badge=defaultBadge();selEid=null;api.saveBadge();renderDesigner(document.getElementById('view'));toast(t('resetDone'));}
function uploadLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{S.seminarLogo=r.result;api.saveLogo(r.result);refreshStage();renderProps();};r.readAsDataURL(f);}
function uploadElementLogo(inp,id){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const e=getEl(id);if(!e)return;e.src=r.result;api.saveBadge();refreshStage();renderProps();};r.readAsDataURL(f);}

function printAll(){const wrap=document.getElementById('printwrap');
  wrap.innerHTML=P().map(p=>`<div class="pbadge" style="width:${bw()}mm;height:${bh()}mm;background:${S.badge.bg}">${badgeInner(p)}</div>`).join('');
  fillQR(wrap);setTimeout(()=>window.print(),150);}

/* ===== boot ===== */
(async function(){
  const data=await api.boot();
  if(data&&data.participants&&data.participants.length){
    S.participants=data.participants.map(p=>({group:null,leader:false,room:'',branch:'',telegram:'',roles:[],...p}));
    S.checkins=data.checkins||{};S.badge=data.badge||null;S.seminarLogo=data.seminarLogo||null;
    S.checkpoints=data.checkpoints||[];S.program=data.program||[];S.roles=data.roles||[];
    S.meta=data.meta||{};S.pageBase=data.pageBase||null;
    if(data.lang)S.lang=data.lang;
  }else{
    S.participants=BASE.map(p=>({...p,group:null,leader:false,room:'',branch:'',telegram:'',roles:[]}));
  }
  if(!S.badge)S.badge=defaultBadge();
  if(!S.checkpoints||!S.checkpoints.length)S.checkpoints=DEF_CPS.map(c=>({...c}));
  if(!S.roles||!S.roles.length)S.roles=DEF_ROLES.map(r=>({...r}));
  if(!S.program)S.program=[];
  if(!S.meta||!S.meta.title)S.meta={...DEF_META};
  if(!S.checkins)S.checkins={};
  S.checkpoints.forEach(c=>{if(!S.checkins[c.key])S.checkins[c.key]={};});
  activeCP=(S.checkpoints[0]||{}).key||'';
  const mt=document.getElementById('modeTag');
  const dot={server:'#12B886',local:'#F0A81A',memory:'#B0AFC4'}[api.mode];
  mt.innerHTML=`<span class="dot" style="background:${dot}"></span>${api.mode==='server'?'Server':api.mode==='local'?'Lokal (brauzer)':'Vaqtinchalik'}`;
  document.getElementById('lang-uz').classList.toggle('on',S.lang==='uz');
  document.getElementById('lang-ru').classList.toggle('on',S.lang==='ru');
  render();
})();
</script>
</body>
